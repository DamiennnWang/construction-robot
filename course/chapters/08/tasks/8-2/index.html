<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>8-2 保养排查｜智能建筑机械与机器人</title>
<style data-lab-shell>/* 第二章任务页：一屏放下（16:9 屏幕不出现纵向滚动），菜单两层，蓝白配色。 */
:root {
  --course-bg:#edf4fc; --course-surface:#fff; --course-ink:#193550; --course-muted:#57718b;
  --course-line:#cbdbea; --course-accent:#2467c9; --blue-soft:#e6f0ff;
  --accent-2:#1c55ad; --surface-2:#f5f8fd; --hair:#e1eaf4;
  --ok:#1f8a5b; --ok-soft:#e5f6ee; --ok-line:#a8dcc2; --warn:#c77a12; --warn-soft:#fdf2e1; --bad:#c2413b; --bad-soft:#fbe7e5;
  --focus:#f0a020;
  --shadow-sm:0 1px 2px rgba(18,44,78,.06);
  --shadow:0 1px 2px rgba(18,44,78,.05), 0 6px 22px rgba(18,44,78,.08);
  --shadow-lg:0 10px 34px rgba(18,44,78,.18);
  --page-bg:linear-gradient(180deg,#eef4fc 0%,#e7eff9 100%);
}
html[data-theme="dark"] {
  --accent-2:#b5d3ff; --surface-2:#1d324b; --hair:#2b4562;
  --ok:#5cc597; --ok-soft:#173a2d; --ok-line:#2f6b51; --warn:#f0b35a; --warn-soft:#3b2d16; --bad:#f08079; --bad-soft:#3d1f1f;
  --shadow-sm:0 1px 2px rgba(0,0,0,.25); --shadow:0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.28); --shadow-lg:0 12px 34px rgba(0,0,0,.45);
  --page-bg:linear-gradient(180deg,#112035 0%,#0d1a2b 100%);
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; }
body {
  display:grid; grid-template-rows:auto auto minmax(0,1fr); height:100vh; height:100dvh; overflow:hidden;
  background:var(--page-bg); color:var(--course-ink);
  font:14px/1.5 "Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; transition:background .15s, border-color .15s, color .15s, box-shadow .15s, transform .15s; }
:focus-visible { outline:3px solid color-mix(in srgb, var(--course-accent) 60%, transparent); outline-offset:2px; }

/* —— 页头：本章任务 —— */
.c2-top {
  display:flex; align-items:center; gap:14px; height:50px; padding:0 18px;
  background:var(--course-surface); border-bottom:1px solid var(--hair); box-shadow:var(--shadow-sm);
}
.c2-back {
  display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px 0 10px; border-radius:16px;
  color:var(--course-ink); text-decoration:none; font-weight:700; white-space:nowrap; font-size:14px; background:var(--surface-2);
}
.c2-back:hover { color:var(--course-accent); background:var(--blue-soft); }
.c2-back-chapter { margin-left:4px; padding-left:9px; border-left:1px solid var(--hair); color:var(--course-muted); font-weight:500; font-size:12.5px; }
@media (max-width:1280px) { .c2-back-chapter { display:none; } }
.c2-tasks { display:flex; gap:2px; margin:0 auto; padding:3px; border-radius:12px; background:var(--surface-2); overflow-x:auto; }
.c2-tasks a { padding:5px 16px; border-radius:9px; color:var(--course-muted); text-decoration:none; white-space:nowrap; font-size:14px; }
.c2-tasks a:hover { color:var(--course-accent); }
.c2-tasks a[aria-current="page"] { background:var(--course-surface); color:var(--course-accent); font-weight:700; box-shadow:var(--shadow-sm); }
.c2-top .course-theme-toggle { margin-left:0 !important; height:32px !important; min-height:32px !important; border-radius:16px !important; }

/* —— 工位条 —— */
.c2-bar { display:flex; align-items:center; gap:20px; padding:12px 18px 10px; }
.c2-title { display:flex; align-items:center; gap:10px; min-width:0; }
.c2-task-id {
  display:inline-flex; align-items:center; height:26px; padding:0 10px; border-radius:13px;
  background:var(--course-accent); color:#fff; font-weight:700; font-size:13px; white-space:nowrap;
}
html[data-theme="dark"] .c2-task-id { color:#0f1d2e; }
.c2-title h1 { margin:0; font-size:22px; line-height:1.2; font-weight:800; letter-spacing:.5px; white-space:nowrap; }
.c2-stations { display:flex; gap:8px; margin-left:auto; }
.c2-station {
  display:flex; align-items:center; gap:9px; height:42px; padding:0 16px 0 7px;
  border:1px solid var(--hair); border-radius:12px; background:var(--course-surface); box-shadow:var(--shadow-sm);
  color:var(--course-ink); font-size:15px; white-space:nowrap;
}
.c2-station:hover { border-color:var(--course-accent); transform:translateY(-1px); }
.c2-station[aria-selected="true"] {
  background:linear-gradient(135deg,#3a82e4,#1f5bbd); border-color:transparent; color:#fff; font-weight:700;
  box-shadow:0 6px 16px rgba(36,103,201,.32);
}
html[data-theme="dark"] .c2-station[aria-selected="true"] { background:linear-gradient(135deg,#8abaff,#5f97ea); color:#0f1d2e; }
.c2-num { display:grid; place-items:center; width:28px; height:28px; border-radius:9px; background:var(--blue-soft); color:var(--course-accent); font-size:14px; font-weight:800; }
.c2-station[aria-selected="true"] .c2-num { background:rgba(255,255,255,.22); color:inherit; }
.c2-check { display:none; width:18px; height:18px; border-radius:50%; background:var(--ok); color:#fff; font-size:11px; font-weight:800; place-items:center; }
.c2-station.done .c2-check { display:grid; }
.c2-station[aria-selected="true"].done .c2-check { background:#fff; color:var(--ok); }

/* —— 主体：三维区 + 面板 —— */
.c2-main { display:grid; grid-template-columns:minmax(0,1fr) clamp(340px,25vw,410px); gap:14px; padding:0 18px 16px; min-height:0; }
.c2-stage {
  display:flex; flex-direction:column; min-height:0; overflow:hidden; border-radius:16px;
  border:1px solid var(--hair); background:var(--course-surface); box-shadow:var(--shadow);
}
.c2-view { position:relative; flex:1 1 auto; min-height:0; background:var(--course-bg); }
.c2-frame { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:transparent; }
.c2-loading {
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  color:var(--course-muted); font-size:15px; background:var(--course-bg); pointer-events:none; z-index:1;
}
.c2-spinner { width:30px; height:30px; border-radius:50%; border:3px solid var(--blue-soft); border-top-color:var(--course-accent); animation:c2-spin .8s linear infinite; }
@keyframes c2-spin { to { transform:rotate(360deg); } }
.c2-tools { position:absolute; left:12px; top:12px; display:flex; gap:6px; flex-wrap:wrap; max-width:64%; z-index:2; }
.c2-tool {
  height:32px; padding:0 12px; border-radius:10px; border:1px solid color-mix(in srgb, var(--hair) 70%, transparent);
  background:color-mix(in srgb, var(--course-surface) 88%, transparent); backdrop-filter:blur(8px);
  color:var(--course-ink); font-size:13px; white-space:nowrap; box-shadow:var(--shadow-sm);
}
.c2-tool:hover { border-color:var(--course-accent); color:var(--course-accent); }
.c2-tool[aria-pressed="true"] { background:var(--blue-soft); border-color:color-mix(in srgb, var(--course-accent) 55%, transparent); color:var(--course-accent); font-weight:700; }
.c2-toolseg {
  padding:3px; border-color:color-mix(in srgb, var(--hair) 70%, transparent) !important;
  background:color-mix(in srgb, var(--course-surface) 88%, transparent) !important; backdrop-filter:blur(8px); box-shadow:var(--shadow-sm);
}
.c2-toolseg button { height:26px; font-size:13px; padding:0 10px; }
.c2-hint {
  position:absolute; right:12px; bottom:10px; color:var(--course-muted); font-size:12px; pointer-events:none; z-index:2;
  max-width:60%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:color-mix(in srgb, var(--course-surface) 72%, transparent); padding:2px 10px; border-radius:10px;
}
.c2-part {
  position:absolute; right:12px; top:12px; z-index:3; width:min(300px,42%); padding:11px 34px 11px 13px; border-radius:12px;
  background:var(--course-surface); border:1px solid var(--hair); border-left:4px solid var(--focus);
  box-shadow:var(--shadow-lg); display:flex; flex-direction:column; gap:3px;
}
.c2-part strong { font-size:15px; }
.c2-part span { color:var(--course-muted); font-size:13px; line-height:1.5; }
.c2-x { position:absolute; right:6px; top:4px; border:0; background:none; font-size:18px; color:var(--course-muted); }

/* 三维区底部：运行控制 + 读数（不压在模型上） */
.c2-strip {
  flex:0 0 auto; display:flex; align-items:stretch; gap:10px; padding:8px 10px;
  border-top:1px solid var(--hair); background:var(--course-surface);
}
.c2-strip:has(.c2-transport:empty):has(.c2-readouts:empty) { display:none; }
.c2-transport { display:flex; align-items:center; gap:6px; flex:0 0 auto; padding-right:4px; }
.c2-transport:empty { display:none; }
.c2-transport .c2-tool { box-shadow:none; background:var(--surface-2); border-color:transparent; backdrop-filter:none; height:34px; }
.c2-transport .c2-tool:hover { background:var(--blue-soft); }
.c2-play {
  height:38px; min-width:96px; padding:0 16px; border-radius:11px; border:0;
  background:linear-gradient(135deg,#3a82e4,#1f5bbd); color:#fff; font-weight:700; font-size:14.5px;
  box-shadow:0 4px 12px rgba(36,103,201,.3);
}
.c2-play:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(36,103,201,.36); }
.c2-play[aria-pressed="true"] { background:linear-gradient(135deg,#4c5f78,#33465e); box-shadow:0 4px 12px rgba(30,45,65,.25); }
html[data-theme="dark"] .c2-play { background:linear-gradient(135deg,#8abaff,#5f97ea); color:#0f1d2e; }
.c2-readouts { display:flex; gap:6px; flex:1 1 auto; min-width:0; }
.c2-read {
  flex:1 1 0; min-width:84px; display:flex; flex-direction:column; justify-content:center; padding:4px 12px;
  border-radius:11px; background:var(--surface-2);
}
.c2-read-label { color:var(--course-muted); font-size:12px; white-space:nowrap; }
.c2-val { display:flex; align-items:baseline; gap:4px; white-space:nowrap; overflow:hidden; }
.c2-val b { font-size:21px; line-height:1.2; font-weight:800; font-variant-numeric:tabular-nums; color:var(--course-ink); }
.c2-val small { color:var(--course-muted); font-size:12px; }

/* —— 操作面板 —— */
.c2-panel {
  display:flex; flex-direction:column; gap:12px; min-height:0; overflow:auto; padding:16px 16px 14px;
  border-radius:16px; border:1px solid var(--hair); background:var(--course-surface); box-shadow:var(--shadow); scrollbar-width:thin;
}
.c2-head-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.c2-head-name { display:flex; align-items:center; gap:9px; min-width:0; }
.c2-head-num {
  flex:0 0 30px; height:30px; border-radius:10px; display:grid; place-items:center; font-weight:800; font-size:15px; color:#fff;
  background:linear-gradient(135deg,#3a82e4,#1f5bbd); box-shadow:0 3px 8px rgba(36,103,201,.3);
}
html[data-theme="dark"] .c2-head-num { color:#0f1d2e; background:linear-gradient(135deg,#8abaff,#5f97ea); }
.c2-panel-head h2 { margin:0; font-size:19px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.c2-panel-head p { margin:6px 0 0; color:var(--course-muted); font-size:13.5px; line-height:1.55; }
.c2-redo { height:30px; padding:0 11px; border-radius:15px; border:1px solid var(--hair); background:var(--surface-2); color:var(--course-muted); font-size:12.5px; white-space:nowrap; }
.c2-redo:hover { color:var(--course-accent); border-color:var(--course-accent); }
.c2-panel-body { display:flex; flex-direction:column; gap:14px; }
.c2-group { display:flex; flex-direction:column; gap:8px; }
.c2-group h3 { margin:0; font-size:13px; color:var(--accent-2); font-weight:700; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.c2-h3-text { display:flex; align-items:center; gap:7px; }
.c2-h3-text::before { content:""; width:4px; height:14px; border-radius:2px; background:var(--course-accent); }
.c2-row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.c2-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; }
.c2-btn {
  height:36px; padding:0 14px; border-radius:10px; border:1px solid var(--hair);
  background:var(--course-surface); color:var(--course-ink); white-space:nowrap; box-shadow:var(--shadow-sm);
}
.c2-btn:hover:not(:disabled) { border-color:var(--course-accent); color:var(--course-accent); }
.c2-btn:disabled { opacity:.45; cursor:not-allowed; }
.c2-btn.c2-primary { background:linear-gradient(135deg,#3a82e4,#1f5bbd); border-color:transparent; color:#fff; font-weight:700; box-shadow:0 4px 12px rgba(36,103,201,.28); }
.c2-btn.c2-primary:hover:not(:disabled) { color:#fff; transform:translateY(-1px); }
html[data-theme="dark"] .c2-btn.c2-primary { background:linear-gradient(135deg,#8abaff,#5f97ea); color:#0f1d2e; }
.c2-btn.c2-small { height:32px; padding:0 12px; }
.c2-btn[aria-pressed="true"] { background:var(--blue-soft); border-color:var(--course-accent); color:var(--course-accent); font-weight:700; }
.c2-seg { display:flex; padding:3px; gap:3px; border-radius:11px; background:var(--surface-2); border:1px solid var(--hair); }
.c2-seg button { flex:1; height:32px; padding:0 8px; border:0; border-radius:8px; background:none; color:var(--course-muted); white-space:nowrap; }
.c2-seg button:hover { color:var(--course-accent); }
.c2-seg button[aria-checked="true"] { background:var(--course-surface); color:var(--course-accent); font-weight:700; box-shadow:0 1px 4px rgba(18,44,78,.14); }
.c2-speed { padding:2px; border-radius:10px; }
.c2-speed button { height:30px; padding:0 10px; font-size:13px; }

/* 滑块：已走过的一段用主色填充 */
.c2-slider { display:flex; flex-direction:column; gap:3px; min-width:0; }
.c2-slider-top { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13.5px; }
.c2-slider output {
  font-weight:700; color:var(--course-accent); font-variant-numeric:tabular-nums; white-space:nowrap;
  background:var(--blue-soft); padding:0 8px; border-radius:8px; font-size:13px; line-height:22px;
}
.c2-slider input[type="range"] {
  -webkit-appearance:none; appearance:none; width:100%; height:22px; margin:0; background:transparent; cursor:pointer; --p:50%;
}
.c2-slider input[type="range"]::-webkit-slider-runnable-track {
  height:6px; border-radius:3px; background:linear-gradient(to right, var(--course-accent) var(--p), var(--hair) var(--p));
}
.c2-slider input[type="range"]::-moz-range-track { height:6px; border-radius:3px; background:var(--hair); }
.c2-slider input[type="range"]::-moz-range-progress { height:6px; border-radius:3px; background:var(--course-accent); }
.c2-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance:none; width:18px; height:18px; margin-top:-6px; border-radius:50%;
  background:#fff; border:3px solid var(--course-accent); box-shadow:0 2px 6px rgba(18,44,78,.25);
}
.c2-slider input[type="range"]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff; border:3px solid var(--course-accent); }
.c2-slider input[type="range"]:hover::-webkit-slider-thumb { transform:scale(1.12); }

.c2-switch {
  display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 10px 0 6px; border-radius:10px;
  border:1px solid var(--hair); background:var(--course-surface); font-size:13.5px; white-space:nowrap;
}
.c2-knob { position:relative; width:30px; height:18px; border-radius:10px; background:var(--course-line); transition:background .15s; }
.c2-knob::after { content:""; position:absolute; left:2px; top:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.25); }
.c2-switch[aria-checked="true"] .c2-knob { background:var(--course-accent); }
.c2-switch[aria-checked="true"] .c2-knob::after { transform:translateX(12px); }
.c2-chips { display:flex; flex-wrap:wrap; gap:6px; }
.c2-chip { height:30px; padding:0 12px; border-radius:15px; border:1px solid var(--hair); background:var(--course-surface); font-size:13px; white-space:nowrap; box-shadow:var(--shadow-sm); }
.c2-chip:hover { border-color:var(--course-accent); color:var(--course-accent); }
.c2-chip[aria-pressed="true"] { background:var(--focus); border-color:var(--focus); color:#2b1a00; font-weight:700; }
.c2-chip.done { background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok); font-weight:700; }

/* 试一试：挑战卡 */
.c2-count { font-weight:800; color:var(--course-accent); font-size:13px; font-variant-numeric:tabular-nums; }
.c2-progress { height:5px; border-radius:3px; background:var(--hair); overflow:hidden; }
.c2-progress span { display:block; height:100%; width:0; border-radius:3px; background:linear-gradient(90deg,#3fb27f,#1f8a5b); transition:width .4s ease; }
.c2-challenges { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.c2-challenge {
  display:flex; gap:9px; align-items:flex-start; padding:9px 10px; border-radius:12px; min-width:0;
  border:1px solid var(--hair); background:var(--course-surface); box-shadow:var(--shadow-sm);
  transition:border-color .2s, background .2s, transform .2s;
}
.c2-mark {
  flex:0 0 30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:16px; line-height:1;
  background:linear-gradient(135deg,#eaf2ff,#d9e8ff); color:var(--course-accent); font-weight:800;
}
html[data-theme="dark"] .c2-mark { background:var(--blue-soft); }
.c2-ch-text { display:flex; flex-direction:column; gap:1px; min-width:0; }
.c2-ch-text b { font-size:13.5px; line-height:1.35; font-weight:700; }
.c2-ch-text span { color:var(--course-muted); font-size:12px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.c2-ch-go {
  align-self:flex-start; margin-top:5px; height:26px; padding:0 10px; border-radius:13px; border:0;
  background:var(--course-accent); color:#fff; font-size:12.5px; font-weight:700;
}
html[data-theme="dark"] .c2-ch-go { color:#0f1d2e; }
.c2-challenge.done { background:var(--ok-soft); border-color:var(--ok-line); }
.c2-challenge.done .c2-mark { background:var(--ok); color:#fff; animation:c2-pop .45s ease; }
.c2-challenge.done .c2-ch-text span { color:var(--ok); font-weight:700; }
.c2-challenge.done .c2-ch-go { display:none; }
@keyframes c2-pop { 0% { transform:scale(.6); } 60% { transform:scale(1.18); } 100% { transform:scale(1); } }

.c2-choice, .c2-predict { display:flex; flex-direction:column; gap:6px; padding:10px 12px; border-radius:12px; background:var(--surface-2); border:1px solid var(--hair); }
.c2-prompt { margin:0; font-weight:700; font-size:14px; }
.c2-options { display:flex; gap:6px; flex-wrap:wrap; }
.c2-opt { flex:1 1 auto; min-height:34px; padding:4px 12px; border-radius:9px; border:1px solid var(--hair); background:var(--course-surface); }
.c2-opt:hover:not(:disabled) { border-color:var(--course-accent); }
.c2-opt.right { background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:700; }
.c2-opt.wrong { background:var(--bad-soft); border-color:var(--bad); color:var(--bad); text-decoration:line-through; }
.c2-opt:disabled:not(.right):not(.wrong) { opacity:.5; }
.c2-predict.c2-inline { flex-direction:row; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:8px 12px; }
.c2-predict.c2-inline .c2-row { flex-wrap:nowrap; }
.c2-predict.c2-inline input { width:72px; }
.c2-predict input { width:100px; height:34px; padding:0 10px; border-radius:9px; border:1px solid var(--hair); background:var(--course-surface); font-size:16px; font-weight:700; }
.c2-predict input.right { border-color:var(--ok); background:var(--ok-soft); }
.c2-predict input.wrong { border-color:var(--bad); background:var(--bad-soft); }
.c2-unit { color:var(--course-muted); }
.c2-note { margin:0; color:var(--course-muted); font-size:12.5px; line-height:1.45; }
.c2-big { font-size:15px; font-weight:700; }
.c2-banner {
  display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 12px; border-radius:12px;
  background:linear-gradient(135deg,#fff4dc,#ffe9bf); border:1px solid #f3cf87; color:#6b4300; font-size:13px; font-weight:700;
}
html[data-theme="dark"] .c2-banner { background:#3b2d16; border-color:#6b5124; color:#f6d38f; }
.c2-quiet { color:var(--course-muted); }

/* 8-2 保养排查：三维区与面板的补充样式（外壳样式在 shared/lab-shell）。 */

/* —— 三维区 —— */
html.lab-native .m82-stage { overflow:hidden; background:linear-gradient(180deg,#f4f7fb 0%,#e3e9f0 100%); touch-action:none; outline:none; }
html[data-theme="dark"].lab-native .m82-stage { background:linear-gradient(180deg,#16263a 0%,#0d1826 100%); }
.m82-stage > canvas { display:block; width:100% !important; height:100% !important; cursor:grab; }
.m82-stage > canvas:active { cursor:grabbing; }
.m82-no3d { display:grid; place-items:center; color:var(--course-muted); font-size:14px; padding:24px; text-align:center; }
.m82-overlay { position:absolute; inset:0; pointer-events:none; }

/* 模型上的检查点：编号圆点 + 名称，状态用颜色区分 */
.m82-pt {
  position:absolute; left:0; top:0; pointer-events:auto; display:flex; align-items:center; gap:6px;
  margin:-14px 0 0 -14px; padding:3px 10px 3px 3px; border-radius:16px; border:1px solid rgba(255,255,255,.7);
  background:rgba(255,255,255,.88); backdrop-filter:blur(6px); box-shadow:0 4px 14px rgba(21,45,80,.18);
  font:600 12.5px/1 inherit; color:#1e3550; cursor:pointer; white-space:nowrap; transition:opacity .2s, background .15s, box-shadow .15s;
}
.m82-pt i {
  width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:12px; font-weight:700;
  background:#3a82e4; color:#fff; box-shadow:0 0 0 3px rgba(58,130,228,.22);
}
.m82-pt[data-state="todo"] i { animation:m82-pulse 2.2s ease-in-out infinite; }
.m82-pt[data-state="ok"] i { background:#2e9e6b; box-shadow:0 0 0 3px rgba(46,158,107,.22); }
.m82-pt[data-state="ok"] i::before { content:'✓'; }
.m82-pt[data-state="done"] i { background:#c8931f; box-shadow:0 0 0 3px rgba(200,147,31,.25); }
.m82-pt[data-state="bad"] i { background:#d6453b; box-shadow:0 0 0 3px rgba(214,69,59,.25); }
.m82-pt[data-state="bad"] i::before { content:'!'; }
.m82-pt:is([data-state="ok"],[data-state="bad"]) i { font-size:0; }
.m82-pt:is([data-state="ok"],[data-state="bad"]) i::before { font-size:12px; }
.m82-pt:hover { background:#fff; box-shadow:0 6px 18px rgba(21,45,80,.26); }
.m82-pt[hidden] { display:none; }
html[data-theme="dark"] .m82-pt { background:rgba(20,34,52,.86); border-color:rgba(255,255,255,.12); color:#e3ecf7; }
html[data-theme="dark"] .m82-pt:hover { background:rgba(30,48,72,.95); }
@keyframes m82-pulse { 0%,100% { box-shadow:0 0 0 3px rgba(58,130,228,.22); } 50% { box-shadow:0 0 0 7px rgba(58,130,228,.08); } }
@media (prefers-reduced-motion:reduce) { .m82-pt i { animation:none !important; } }

/* —— 三维区上方：情境 —— */
.m82-cases { display:flex; align-items:center; gap:6px; width:100%; flex-wrap:nowrap; }
.m82-cases-label { font-size:12px; font-weight:700; color:var(--course-muted); padding:0 4px 0 2px; white-space:nowrap; }
.m82-case {
  flex:1 1 0; min-width:0; height:32px; padding:0 12px; border-radius:10px; border:1px solid var(--hair);
  background:var(--course-surface); color:var(--course-ink); font:600 13px/1 inherit; cursor:pointer; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; box-shadow:var(--shadow-sm); transition:border-color .15s, background .15s, color .15s;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.m82-case::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
.m82-case.abn::before { background:var(--warn); }
.m82-case.unk::before { background:var(--course-muted); }
.m82-case:hover { border-color:var(--course-accent); }
.m82-case[aria-checked="true"] { border-color:var(--course-accent); background:var(--blue-soft); color:var(--course-accent); box-shadow:0 0 0 1px var(--course-accent) inset; }

/* —— 面板：现场 —— */
html[data-c3-task="8-2"] .c2-panel-head > p:empty { display:none; }
.m82-pills { display:flex; flex-wrap:wrap; gap:6px; }
.m82-pill { display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 10px; border-radius:13px; background:var(--surface-2, var(--course-bg)); font-size:12px; color:var(--course-muted); }
.m82-pill b { color:var(--course-ink); font-weight:650; font-variant-numeric:tabular-nums; }
.m82-pill i { width:7px; height:7px; border-radius:50%; background:var(--course-muted); }
.m82-pill[data-s="ok"] i { background:var(--ok); }
.m82-pill[data-s="warn"] i { background:var(--warn); }
.m82-pill[data-s="warn"] b { color:var(--warn); }

/* —— 面板：维护流程（竖向步骤线） —— */
.m82-flow { list-style:none; margin:0; padding:0; display:grid; gap:2px; counter-reset:m82; }
.m82-step { position:relative; counter-increment:m82; }
.m82-step:not(.m82-ends)::before { content:''; position:absolute; left:15px; top:30px; bottom:-6px; width:2px; background:var(--hair); border-radius:1px; }
.m82-step.done:not(.m82-ends)::before { background:var(--ok); opacity:.55; }
.m82-step-btn {
  position:relative; display:flex; align-items:center; gap:10px; width:100%; min-height:32px; padding:3px 10px 3px 4px;
  border:1px solid transparent; border-radius:10px; background:none; color:var(--course-ink); font:600 13.5px/1.3 inherit;
  text-align:left; cursor:pointer; transition:background .15s, border-color .15s;
}
.m82-step-btn:not(.static):hover { background:var(--blue-soft); }
html.lab-native .c2-panel .m82-step-btn.static { cursor:default; opacity:1; }
.m82-step-text { flex:1; }
.m82-dot {
  flex:none; width:24px; height:24px; margin-left:3px; border-radius:50%; display:grid; place-items:center;
  border:2px solid var(--hair); background:var(--course-surface); font-size:11.5px; font-weight:700; color:var(--course-muted);
}
.m82-dot::before { content:counter(m82); }
.m82-step.done .m82-dot { border-color:var(--ok); background:var(--ok); color:#fff; }
.m82-step.done .m82-dot::before { content:'✓'; }
.m82-step.next .m82-step-btn { border-color:var(--course-accent); background:var(--blue-soft); }
.m82-step.next .m82-dot { border-color:var(--course-accent); color:var(--course-accent); }
.m82-step.bad .m82-dot { border-color:var(--bad); color:var(--bad); background:var(--course-surface); }
.m82-step.bad .m82-dot::before { content:'!'; }
.m82-pct { font-size:12px; color:var(--course-muted); font-variant-numeric:tabular-nums; }
.m82-step.done .m82-pct { color:var(--ok); }

.m82-chips, .m82-mats { display:flex; flex-wrap:wrap; gap:5px; padding:2px 0 6px 41px; }
.m82-chip, .m82-mat {
  display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 9px 0 4px; border-radius:14px; border:1px solid var(--hair);
  background:var(--course-surface); color:var(--course-ink); font:500 12.5px/1 inherit; cursor:pointer; transition:border-color .15s, background .15s;
}
.m82-mat { padding:0 10px; border-radius:8px; }
.m82-chip i { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:11px; font-weight:700; background:var(--blue-soft); color:var(--course-accent); }
.m82-chip:hover, .m82-mat:hover { border-color:var(--course-accent); }
.m82-chip[data-state="ok"] { border-color:var(--ok); }
.m82-chip[data-state="ok"] i { background:var(--ok); color:#fff; }
.m82-chip[data-state="done"] { border-color:#c8931f; background:var(--warn-soft); }
.m82-chip[data-state="done"] i { background:#c8931f; color:#fff; }
.m82-chip[data-state="bad"] { border-color:var(--bad); background:var(--bad-soft); color:var(--bad); }
.m82-chip[data-state="bad"] i { background:var(--bad); color:#fff; }
.m82-mat[aria-checked="true"] { border-color:var(--course-accent); color:var(--course-accent); background:var(--blue-soft); font-weight:650; }
.m82-mat[aria-checked="true"]:not(.ok) { border-color:var(--bad); color:var(--bad); background:var(--bad-soft); }

.m82-bar span { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--course-accent),var(--ok)); transition:width .4s; }
.m82-tip { margin:0 10px 4px 41px; font-size:12px; line-height:1.45; color:var(--course-muted); }
.m82-ends { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:6px 0 0 41px; }
.m82-ends .c2-btn { width:100%; }
.m82-hand { border-color:var(--warn) !important; color:var(--warn) !important; }
.m82-verdict { margin-top:8px; padding:8px 11px; border-radius:10px; font-size:12.5px; line-height:1.45; font-weight:600; }
.m82-verdict.ok { background:var(--ok-soft); color:var(--ok); }
.m82-verdict.warn { background:var(--warn-soft); color:var(--warn); }

/* —— 面板：交接记录 —— */
.m82-records { list-style:none; margin:0; padding:0; display:grid; gap:4px; max-height:120px; overflow:auto; }
.m82-records li { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; padding:5px 9px; border-radius:8px; background:var(--surface-2, var(--course-bg)); font-size:12.5px; }
.m82-rec-st { font-weight:650; }
.m82-rec-case { color:var(--course-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.m82-records li.ok b { color:var(--ok); }

.m82-records li.m82-empty { display:block; color:var(--course-muted); background:none; padding:2px 0; }

  .m82-chip, .m82-mat { height:26px; }
}

/* 课程任务页外壳（第二章起使用）：页头（本章任务）→ 工位条 → 三维区 + 操作面板。
 * 两种用法：
 *   LabShell.embedded(cfg)  三维区放原版实验页（iframe，嵌入模式只显示三维视图），面板通过 postMessage 驱动原模型。（第二章）
 *   LabShell.native(cfg)    页面自己的三维区与原有控件直接搬进外壳，面板里重新编排，状态由 cfg.poll() 读取。（第三章）
 * 菜单只有两层；面板里没有标签页，也没有“学习目标/学习任务”。设计规范见 course/设计规范.md。

    const native = Boolean(cfg.native);

      b.addEventListener('keydown', e => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault(); const j = (i + (e.key === 'ArrowRight' ? 1 : -1) + cfg.stations.length) % cfg.stations.length;
        select(j); tabButtons[j].focus();
      });
      tabs.append(b);
      return b;
    });
    const syncTabs = () => tabButtons.forEach((b, i) => {
      b.setAttribute('aria-selected', String(i === current)); b.tabIndex = i === current ? 0 : -1;
      b.classList.toggle('done', Boolean(progress[cfg.stations[i].id]));
    });

    /* 嵌入模式：与原版实验页通信（只用 postMessage，file:// 打开也能用） */
    window.addEventListener('message', e => {
      const d = e.data;
      if (!d || d.c2 !== 'lab' || !frame || e.source !== frame.contentWindow) return;
      if (d.type === 'ready' || (d.type === 'state' && ctx && !ctx.lab.ready)) { loading.hidden = true; sendTheme(); ctx?._ready(); }
      if (d.type === 'state') ctx?._state(d.data);
    });
    const sendTheme = () => frame?.contentWindow?.postMessage({c2: 'cmd', op: 'theme', value: window.CourseTheme?.get?.() || 'light'}, '*');
    window.addEventListener('course-theme-change', sendTheme);

    // 原页面的控件始终留在文档里（原程序可能随时读写它们），换工位时先放回停放处
    function parkAll() { for (const root of [body, readBox]) root.querySelectorAll('[data-c2-adopted]').forEach(n => parking.append(n)); }

    function select(i, fromHash, fromPage) {
      if (i === current) return;
      cleanup.forEach(f => f()); cleanup = [];
      current = i;
      const s = cfg.stations[i];
      if (!fromHash) history.replaceState(null, '', '#' + s.id);
      const ht = h('div', 'c2-head-row'), name = h('div', 'c2-head-name');
      name.append(h('span', 'c2-head-num', String(i + 1)), h('h2', '', s.name));
      ht.append(name, redo);
      head.replaceChildren(ht, h('p', '', s.lead || ''));
      parkAll();
      body.replaceChildren(); clearTimeout(toastTimer); feedback.textContent = ''; feedback.className = 'c2-feedback';
      transportBox.replaceChildren(); readBox.replaceChildren(); tools.replaceChildren(); card.hidden = true;
      hint.textContent = (s.note ? s.note + '　' : '') + (s.hint ?? cfg.hint ?? '拖动旋转 · 滚轮缩放');
      hint.hidden = !hint.textContent;
      if (native) {
        if (!fromPage) cfg.select?.(s.id);
      } else {
        frame?.remove();
        frame = h('iframe', 'c2-frame'); frame.title = s.name + '三维模型';
        frame.src = s.src; loading.hidden = false;
        view.prepend(frame);
      }
      ctx = makeContext(s, i);
      cfg.build?.(ctx, s);
      s.build?.(ctx, s);
      if (native) ctx._ready();
      syncTabs();
      // 原页面的渲染器按容器尺寸重新取景；布局稳定后再通知一次
      dispatchEvent(new Event('resize'));
      if (native) for (const t of [60, 300, 900]) setTimeout(() => dispatchEvent(new Event('resize')), t);
    }
    redo.addEventListener('click', () => { const i = current; current = -1; cfg.reset?.(cfg.stations[i].id); select(i); });
    next.addEventListener('click', () => select(Math.min(current + 1, cfg.stations.length - 1)));

    function makeContext(s, index) {
      const stateFns = new Set(), readyFns = new Set();
      let latest = null, ready = false;
      const send = msg => frame?.contentWindow?.postMessage({c2: 'cmd', ...msg}, '*');
      const c = {
        h, fmt, station: s, index, body, native,
        /* —— 原模型 —— */
        lab: {
          click: (sel, i = 0) => send({op: 'click', sel, index: i}),
          clickText: (sel, text) => send({op: 'clickText', sel, text}),
          set: (sel, value) => send({op: 'set', sel, value}),
          call: (path, ...args) => send({op: 'call', path, args}),
          event: name => send({op: 'event', name}),
          get state() { return latest; },
          get ready() { return ready; },
          onState(fn) { stateFns.add(fn); if (latest) fn(latest); },
          onReady(fn) { readyFns.add(fn); if (ready) fn(); },
        },
        _state(data) { latest = data; stateFns.forEach(f => { try { f(data); } catch (err) { console.warn(err); } }); },
        _ready() { if (ready) return; ready = true; readyFns.forEach(f => f()); },
        /** 把原页面里的一个控件（或一组）搬进面板；换工位时自动放回停放处。 */
        adopt(nodes, into) {
          const list = (Array.isArray(nodes) ? nodes : [nodes]).map(n => (typeof n === 'string' ? document.querySelector(n) : n)).filter(Boolean);
          list.forEach(n => { n.dataset.c2Adopted = '1'; n.hidden = false; (into || body).append(n); });
          return list[0];
        },
        /* —— 反馈 —— */
        /** 反馈以提示条形式出现在三维区上方，几秒后自动收起，不挤占面板。 */
        feedback(text, kind = 'info', keep = false) {
          clearTimeout(toastTimer);
          feedback.replaceChildren();
          if (text) feedback.append(h('span', 'c2-toast-icon', kind === 'ok' ? '✓' : kind === 'warn' ? '!' : 'i'), h('span', 'c2-toast-text', text));
          feedback.className = 'c2-feedback ' + kind;
          if (!keep && text) toastTimer = setTimeout(() => { feedback.textContent = ''; feedback.className = 'c2-feedback'; }, kind === 'warn' ? 5000 : 7000);
        },
        showPart(name, desc) {
          if (!name) { card.hidden = true; return; }
          card.replaceChildren(h('strong', '', name), h('span', '', desc || ''));
          const x = h('button', 'c2-x', '×'); x.type = 'button'; x.setAttribute('aria-label', '关闭'); x.onclick = () => { card.hidden = true; };
          card.append(x); card.hidden = false;
        },
        /* —— 面板控件 —— */
        section(titleText, extra, into = body) {
          const sec = h('section', 'c2-group');
          if (titleText) { const t = h('h3', ''); t.append(h('span', 'c2-h3-text', titleText)); if (extra) t.append(extra); sec.append(t); }
          into.append(sec); return sec;
        },
        button(text, fn, opts = {}) {
          const b = h('button', 'c2-btn' + (opts.primary ? ' c2-primary' : '') + (opts.small ? ' c2-small' : ''), text);
          b.type = 'button'; b.addEventListener('click', fn); if (opts.title) b.title = opts.title; return b;
        },
        row(...items) { const r = h('div', 'c2-row'); r.append(...items); return r; },
        segmented(options, value, onChange, label) {
          const wrap = h('div', 'c2-seg'); wrap.setAttribute('role', 'radiogroup'); if (label) wrap.setAttribute('aria-label', label);
          let currentValue = value;
          const buttons = options.map(o => {
            const b = h('button', '', o.label); b.type = 'button'; b.setAttribute('role', 'radio'); if (o.title) b.title = o.title;
            b.addEventListener('click', () => { set(o.value); onChange(o.value); });
            wrap.append(b); return [o.value, b];
          });
          const set = v => { currentValue = v; buttons.forEach(([val, b]) => b.setAttribute('aria-checked', String(val === v))); };
          set(value);
          return {el: wrap, set, get: () => currentValue};
        },
        slider({label, min, max, step = 1, value, unit = '', format, onInput}) {
          const wrap = h('label', 'c2-slider');
          const t = h('span', 'c2-slider-top'), name = h('span', '', label), out = h('output', '');
          t.append(name, out);
          const input = h('input'); input.type = 'range'; Object.assign(input, {min, max, step, value});
          const show = v => {
            out.textContent = (format ? format(+v) : v) + (unit ? ' ' + unit : '');
            input.style.setProperty('--p', ((+v - min) / (max - min || 1) * 100).toFixed(1) + '%');
          };
          let touching = 0;
          input.addEventListener('input', () => { touching = performance.now(); show(input.value); onInput(+input.value); });
          show(value); wrap.append(t, input);
          return {
            el: wrap, input,
            /** 跟随模型同步显示；用户正在拖动时不打断。 */
            sync(v) { if (performance.now() - touching < 700 || !Number.isFinite(v)) return; if (Math.abs(+input.value - v) > 1e-9) { input.value = v; show(input.value); } },
            set(v) { input.value = v; show(v); }, get: () => +input.value,
          };
        },
        toggle(label, value, onChange) {
          const b = h('button', 'c2-switch'); b.type = 'button'; b.setAttribute('role', 'switch');
          b.append(h('span', 'c2-knob'), h('span', '', label));
          const set = v => b.setAttribute('aria-checked', String(Boolean(v)));
          b.addEventListener('click', () => { const v = b.getAttribute('aria-checked') !== 'true'; set(v); onChange(v); });
          set(value);
          return {el: b, set};
        },
        /** 部件快捷：点一下镜头飞过去。 */
        chips(items, onPick) {
          const wrap = h('div', 'c2-chips');
          const buttons = items.map(it => {
            const b = h('button', 'c2-chip', it.label); b.type = 'button';
            b.addEventListener('click', () => { buttons.forEach(x => x.setAttribute('aria-pressed', String(x === b))); onPick(it); });
            wrap.append(b); return b;
          });
          return {el: wrap, buttons, clear: () => buttons.forEach(x => x.setAttribute('aria-pressed', 'false'))};
        },
        /** 小问题：只用在“看过结果之后”。 */
        choice({prompt, options, answer, onRight, wrong}) {
          const box = h('div', 'c2-choice');
          if (prompt) box.append(h('p', 'c2-prompt', prompt));
          const row = h('div', 'c2-options');
          options.forEach((o, i) => {
            const b = h('button', 'c2-opt', o); b.type = 'button';
            b.addEventListener('click', () => {
              if (box.dataset.solved) return;
              if (i === answer) { b.classList.add('right'); box.dataset.solved = '1'; [...row.children].forEach(x => { x.disabled = x !== b; }); onRight?.(); }
              else { b.classList.add('wrong'); b.disabled = true; c.feedback(typeof wrong === 'function' ? wrong(i) : (wrong || '再看看模型，再选一次。'), 'warn'); }
            });
            row.append(b);
          });
          box.append(row);
          return box;
        },
        /** 先猜一个数，再让模型跑给你看。onGuess 返回 true/false/undefined。 */
        predict({prompt, unit, onGuess, inline}) {
          const box = h('div', 'c2-predict' + (inline ? ' c2-inline' : ''));
          box.append(h('p', 'c2-prompt', prompt));
          const r = h('div', 'c2-row'), input = h('input'); input.type = 'number'; input.inputMode = 'decimal'; input.setAttribute('aria-label', prompt);
          const go = c.button('试试看', () => {
            const v = parseFloat(input.value);
            if (!Number.isFinite(v)) { c.feedback('先填一个数。', 'warn'); return; }
            const ok = onGuess(v); input.classList.toggle('right', ok === true); input.classList.toggle('wrong', ok === false);
          }, {small: true});
          input.addEventListener('keydown', e => { if (e.key === 'Enter') go.click(); });
          r.append(input, h('span', 'c2-unit', unit || ''), go); box.append(r);
          return {el: box, input};
        },
        /** 试一试：几张挑战卡，不分先后；模型状态满足条件就自动打勾。 */
        challenges(list, titleText = '试一试', into = body) {
          const counter = h('span', 'c2-count');
          const sec = c.section(titleText, counter, into);
          const bar = h('div', 'c2-progress'); const fill = h('span'); bar.append(fill);
          const grid = h('div', 'c2-challenges'); sec.append(bar, grid);
          const done = new Set();
          const items = list.map(ch => {
            const li = h('div', 'c2-challenge');
            const mark = h('span', 'c2-mark', ch.icon || '★');
            const txt = h('div', 'c2-ch-text');
            txt.append(h('b', '', ch.title));
            const sub = h('span', '', ch.hint || ''); txt.append(sub);
            li.append(mark, txt);
            if (ch.action) {
              const go = h('button', 'c2-ch-go', ch.action.label); go.type = 'button';
              go.addEventListener('click', e => { e.stopPropagation(); ch.action.fn(); });
              txt.append(go);
            }
            grid.append(li);
            return {ch, li, sub, mark};
          });
          const update = () => { counter.textContent = `${done.size} / ${list.length}`; fill.style.width = (done.size / list.length * 100) + '%'; };
          const complete = id => {
            if (done.has(id)) return;
            const it = items.find(x => x.ch.id === id); if (!it) return;
            done.add(id); it.li.classList.add('done'); it.mark.textContent = '✓';
            if (it.ch.result) c.feedback(it.ch.title + '：' + it.ch.result, 'ok');
            it.sub.textContent = '完成';
            update();
            if (done.size === list.length) {
              progress[s.id] = true; save(); syncTabs();
              setTimeout(() => {
                if (ctx !== c) return;
                c.feedback(current < cfg.stations.length - 1 ? '这一站的挑战都完成了！' : '本任务的挑战都完成了！还可以接着随便调一调。', 'ok', current < cfg.stations.length - 1);
                if (current < cfg.stations.length - 1) feedback.append(next);
              }, 2600);
            }
          };
          c.lab.onState(st => { for (const it of items) if (!done.has(it.ch.id)) { try { if (it.ch.check?.(st)) complete(it.ch.id); } catch {} } });
          update();
          return {complete, isDone: id => done.has(id), section: sec};
        },
        /* —— 三维区：工具、播放、读数 —— */
        view(text, fn, titleText) { const b = h('button', 'c2-tool', text); b.type = 'button'; if (titleText) b.title = titleText; b.addEventListener('click', fn); tools.append(b); return b; },
        /** 三维区左上角的一组单选（如 剖开 / 完整 / 去掉外壳）。 */
        toolSeg(options, value, onChange, label) {
          const seg = c.segmented(options, value, onChange, label); seg.el.classList.add('c2-toolseg'); tools.append(seg.el); return seg;
        },
        tool(text, onToggle, pressed = false) {
          const b = h('button', 'c2-tool', text); b.type = 'button'; b.setAttribute('aria-pressed', String(pressed));
          b.addEventListener('click', () => { const p = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(p)); onToggle(p); });
          tools.append(b); return {el: b, set: p => b.setAttribute('aria-pressed', String(Boolean(p)))};
        },
        transport({onToggle, onStep, onReset, stepText = '单步', extra, speeds, onSpeed, speed}) {
          const play = h('button', 'c2-play', ''); play.type = 'button';
          const set = p => { play.textContent = p ? '❚❚ 暂停' : '▶ 运行'; play.setAttribute('aria-pressed', String(Boolean(p))); };
          play.addEventListener('click', () => { const p = play.getAttribute('aria-pressed') !== 'true'; set(p); onToggle(p); });
          set(false); transportBox.append(play);
          if (onStep) { const st = h('button', 'c2-tool', stepText); st.type = 'button'; st.addEventListener('click', onStep); transportBox.append(st); }
          if (onReset) { const rs = h('button', 'c2-tool', '复位'); rs.type = 'button'; rs.addEventListener('click', onReset); transportBox.append(rs); }
          let speedSeg = null;
          if (speeds) { speedSeg = c.segmented(speeds.map(([v, l]) => ({value: v, label: l})), speed ?? speeds[0][0], onSpeed, '快慢'); speedSeg.el.classList.add('c2-speed'); transportBox.append(speedSeg.el); }
          if (extra) transportBox.append(extra);
          return {setPlaying: set, setSpeed: v => speedSeg?.set(v)};
        },
        /** 把原页面的元素放进三维区底部一栏。 */
        stripAdopt(nodes) { const list = (Array.isArray(nodes) ? nodes : [nodes]).map(n => (typeof n === 'string' ? document.querySelector(n) : n)).filter(Boolean); list.forEach(n => { n.dataset.c2Adopted = '1'; readBox.append(n); }); },
        readouts(defs) {
          const cells = {};
          readBox.replaceChildren();
          for (const d of defs) {
            const cell = h('div', 'c2-read'), v = h('b', '', '—'), u = h('small', '', d.unit || '');
            const val = h('span', 'c2-val'); val.append(v, u);
            cell.append(h('span', 'c2-read-label', d.label), val);
            readBox.append(cell); cells[d.id] = {v, u, cell};
          }
          return (id, value, unit) => {
            const x = cells[id]; if (!x) return;
            if (x.v.textContent !== String(value)) x.v.textContent = value;
            if (unit != null && x.u.textContent !== unit) x.u.textContent = unit;
          };
        },
        onCleanup(fn) { cleanup.push(fn); },
      };
      return c;
    }

    /* 原地模式：定时读原页面状态；原页面自己切换了活动时，工位条跟着变 */
    if (native) {
      setInterval(() => {
        let st = null;
        try { st = cfg.poll?.(); } catch (err) { /* 页面尚未就绪 */ }
        if (st && ctx) ctx._state(st);
        const pageStation = cfg.current?.();
        if (pageStation) { const j = cfg.stations.findIndex(s => s.id === pageStation); if (j >= 0 && j !== current) select(j, false, true); }
      }, 200);
    }

    const fromHash = () => {
      const id = location.hash.slice(1), i = cfg.stations.findIndex(s => s.id === id);
      return i >= 0 ? i : 0;
    };
    window.addEventListener('hashchange', () => select(fromHash(), true));
    select(fromHash(), true);
    window.c2Lab = {select, get ctx() { return ctx; }, get frame() { return frame; }, get current() { return current; }};
  }

  window.LabShell = {
    embedded: start,
    native: cfg => start({...cfg, native: true}),
  };
  window.C2Lab = {start};
})();

/* 原地模式的统一任务页外壳（全课程共用）：把原页面装进 lab-shell。
 * 原页面的全部元素先移入一个隐藏容器（仍在文档里，原有程序照常工作），
 * 各任务的 src/stations.js 再把需要的三维区和控件搬进外壳。
 * 章节标题和本章任务列表来自 shared/lab-shell/chapters.json，由 native-layout.mjs 写进 window.CHAPTER_LAYOUT。
 */
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const all = s => [...document.querySelectorAll(s)];

  // 外壳里的原有滑轨：已走过的一段用主色填充，跟随拖动和程序改值
  const fill = input => {
    const min = +input.min || 0, max = input.max === '' ? 100 : +input.max, v = +input.value;
    input.style.setProperty('--p', (((v - min) / ((max - min) || 1)) * 100).toFixed(1) + '%');
  };
  document.addEventListener('input', e => { if (e.target.matches?.('input[type="range"]')) fill(e.target); }, true);
  setInterval(() => document.querySelectorAll('.c2-panel input[type="range"], .c2-strip input[type="range"]').forEach(fill), 250);

  window.NativeShell = window.C3Shell = {
    $, all,
    start(cfg) {
      const layout = window.CHAPTER_LAYOUT || {}, chapter = layout.chapter || {};
      const legacy = document.createElement('div');
      legacy.className = 'c3-legacy'; legacy.hidden = true;
      [...document.body.children]
        .filter(e => !['SCRIPT', 'STYLE', 'DIALOG', 'TEMPLATE'].includes(e.tagName) && e.id !== 'toast' && !e.matches('.course-theme-toggle'))
        .forEach(e => legacy.append(e));
      document.body.append(legacy);
      document.documentElement.dataset.c3Task = layout.task || '';
      LabShell.native({
        chapter: {title: chapter.title, href: chapter.href},
        tasks: chapter.tasks || [], taskNav: layout.nav, hint: '', progressKey: layout.nav,
        ...cfg,
      });
    },
  };
})();

/* 任务 8-2 保养排查 —— 统一任务页外壳。两个工位结构对称：
 * 三维区上方选情境；三维区底部四格读数；面板依次是 维护流程（准备、隔离、能量确认、逐点检查、资料与材料、处理、复查/移交）→ 试一试 → 交接记录。
 * 所有操作都交给 window.MaintLab.dispatch（src/app.js），状态与存储（localStorage course-maintenance-v2）都在那里。
 */
(() => {
  'use strict';
  const S = window.NativeShell, lab = window.MaintLab, M = window.MaintModel;
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const btn = (cls, text, fn) => { const b = h('button', cls, text); b.type = 'button'; if (fn) b.addEventListener('click', fn); return b; };

  const SPEC = {
    engine: {
      normal: ['🛢', '完成一次班后点检', '选“班后点检”，走完流程再复查', '油位补到刻线之间，复查通过才算完成这一单。'],
      anomaly: ['💧', '发现渗油，停下移交', '选“底部渗油”，看过底部后移交', '有渗漏就不做常规保养，问题原样交给检修。'],
      early: ['🔥', '还烫就开冷却液盖？', '停机后不等冷却，直接点冷却液壶', '机体还烫时冷却系统带压，开盖会喷出热液——先等冷却。'],
      anomalyCases: ['leak', 'belt'], anomalyPoint: 'under',
    },
    excavator: {
      normal: ['🔧', '完成一次班后润滑', '选“班后润滑”，六个点都加注再复查', '每个铰点都有新脂挤出，复查通过才算完成。'],
      anomaly: ['💧', '油缸渗漏，停下移交', '选“动臂油缸渗漏”，看过油缸后移交', '渗漏要检修，加多少润滑脂都盖不住问题。'],
      early: ['⚠', '铲斗悬空就去加注？', '铲斗还没落地时点一个黄油嘴', '铲斗悬在空中，人不能进到工作装置下面——先落地。'],
      anomalyCases: ['seep', 'loose'], anomalyPoint: 'boomRod',
    },
  };

  const caseBar = h('div', 'm82-cases');
  caseBar.setAttribute('role', 'radiogroup'); caseBar.setAttribute('aria-label', '情境');
  let view = null;

  function buildStation(c) {
    const id = c.station.id, st = M.STATIONS[id], spec = SPEC[id];
    const act = ev => lab.dispatch(ev);

    /* 情境 */
    caseBar.replaceChildren(h('span', 'm82-cases-label', '情境'));
    const caseButtons = st.cases.map(([value, text]) => {
      const b = btn('m82-case', text, () => { if (lab.state().work[id].scenario !== value || closed()) act({type: 'case', value}); });
      b.setAttribute('role', 'radio'); b.dataset.value = value;
      if (value === 'unknown') b.classList.add('unk'); else if (value !== 'normal') b.classList.add('abn');
      caseBar.append(b); return b;
    });
    const closed = () => { const w = lab.state().work[id]; return w.verified || w.handoff; };

    /* 三维区底部读数（与 8-1 同一位置）：四格 */
    const read = c.readouts(id === 'engine'
      ? [{id: 'a', label: '发动机'}, {id: 'b', label: '机体温度', unit: '℃'}, {id: 'c', label: '电源'}, {id: 'd', label: '已检查'}]
      : [{id: 'a', label: '铲斗'}, {id: 'b', label: '液压残压', unit: 'bar'}, {id: 'c', label: '先导锁定'}, {id: 'd', label: '已加注'}]);

    /* 维护流程 */
    const gFlow = c.section('维护流程');
    const flow = h('ol', 'm82-flow'); gFlow.append(flow);
    const step = (text, type) => {
      const li = h('li', 'm82-step'), b = btn('m82-step-btn', null, type ? () => act({type}) : null);
      b.append(h('span', 'm82-dot'), h('span', 'm82-step-text', text)); li.append(b); flow.append(li); return {li, b};
    };
    const sPrep = step(st.steps.prepare, 'prepare');
    const sIso = step(st.steps.isolate, 'isolate');
    const sEnergy = step(st.steps.energy, 'energy');
    const sCheck = step(id === 'engine' ? '逐点检查（点模型上的编号）' : '逐个检查铰点（点模型上的编号）');
    sCheck.b.classList.add('static'); sCheck.b.disabled = true;
    const chips = h('div', 'm82-chips');
    const chipButtons = st.points.map(([p, name], i) => {
      const b = btn('m82-chip', null, () => { const w = lab.state().work[id]; if (w.checked[p] && id === 'excavator' && !w.done[p]) act({type: 'service', point: p}); else if (w.checked[p]) lab.focus(p); else act({type: 'inspect', point: p}); });
      b.dataset.point = p; b.append(h('i', '', String(i + 1)), h('span', '', name)); chips.append(b); return b;
    });
    sCheck.li.append(chips);
    const sRead = step('核对型号与资料', 'read');
    const sMat = step(id === 'engine' ? '选机油' : '选润滑脂');
    sMat.b.classList.add('static'); sMat.b.disabled = true;
    const mats = h('div', 'm82-mats');
    const matButtons = st.materials.map(([value, text]) => { const b = btn('m82-mat' + (value === 'spec' ? ' ok' : ''), text, () => act({type: 'material', value})); b.setAttribute('role', 'radio'); b.dataset.value = value; mats.append(b); return b; });
    sMat.li.append(mats);
    const sService = step(st.service, 'service');
    const pct = h('b', 'm82-pct', '0%'); sService.b.append(pct);
    const bar = h('div', 'm82-bar'), fill = h('span'); bar.append(fill); sService.li.append(bar);
    if (id === 'excavator') sService.li.append(h('p', 'm82-tip', '检查过的黄油嘴再点一次就加注；也可以按这一步，按顺序加注下一个。'));
    const ends = h('li', 'm82-step m82-ends');
    ends.append(btn('c2-btn c2-primary', '复查', () => act({type: 'verify'})), btn('c2-btn m82-hand', '移交检修', () => act({type: 'handoff'})));
    flow.append(ends);
    const verdict = h('div', 'm82-verdict'); verdict.hidden = true; gFlow.append(verdict);

    /* 试一试 */
    const mine = (s, fn) => (s.records || []).some(r => r.station === id && fn(r));
    c.challenges([
      {id: 'normal', icon: spec.normal[0], title: spec.normal[1], hint: spec.normal[2], result: spec.normal[3],
        check: s => mine(s, r => r.scenario === 'normal' && r.resolved)},
      {id: 'anomaly', icon: spec.anomaly[0], title: spec.anomaly[1], hint: spec.anomaly[2], result: spec.anomaly[3],
        check: s => mine(s, r => spec.anomalyCases.includes(r.scenario) && !r.resolved && r.unresolved.some(u => !u.startsWith('未发现')))},
      {id: 'early', icon: spec.early[0], title: spec.early[1], hint: spec.early[2], result: spec.early[3],
        check: s => !!s.tried?.[id]?.early},
      {id: 'unknown', icon: '❓', title: '资料不明时不猜', hint: '选资料不明的情境，核对资料后移交', result: '查不到规格就不补加、不混用，把待确认事项交出去。',
        check: s => mine(s, r => r.scenario === 'unknown' && !r.resolved)},
    ]);

    /* 交接记录（两个工位共用） */
    const count = h('span', 'c2-count');
    const gRec = c.section('交接记录', count);
    const list = h('ul', 'm82-records');
    const tools = h('div', 'm82-rec-tools');
    const bExport = btn('c2-btn c2-small', '导出交接卡', () => lab.exportRecord());
    const bClear = btn('c2-btn c2-small m82-clear', '清空全部记录', () => {
      if (!confirm('清空两个工位的全部处理与交接记录？')) return;
      lab.reset(); c.feedback('记录已清空，两个工位都回到开始。', 'info');
    });
    tools.append(bExport, bClear); gRec.append(list, tools);

    c.view('全景', () => lab.frame());
    c.view('俯视', () => lab.top());

    let key = '';
    view = s => {
      const w = s.work[id], r = lab.readouts();
      const k = JSON.stringify([w, s.records, r.temp, r.pressure]);
      if (k === key) return; key = k;
      caseButtons.forEach(b => b.setAttribute('aria-checked', String(b.dataset.value === w.scenario)));
      const nPts = st.points.length, nC = st.points.filter(([p]) => w.checked[p]).length, nD = st.points.filter(([p]) => w.done[p]).length;
      if (id === 'engine') {
        read('a', w.prepared ? '已停机' : '运转中'); read('b', r.temp); read('c', w.isolated ? '断开·挂牌' : '接通'); read('d', nC + ' / ' + nPts);
      } else {
        read('a', w.prepared ? '已落地' : '悬空'); read('b', r.pressure); read('c', w.isolated ? '放下·挂牌' : '未锁定'); read('d', nD + ' / ' + nPts);
      }
      const mark = (s0, done) => s0.li.classList.toggle('done', Boolean(done));
      const nChecked = st.points.filter(([p]) => w.checked[p]).length;
      mark(sPrep, w.prepared); mark(sIso, w.isolated); mark(sEnergy, w.energy);
      mark(sCheck, nChecked === st.points.length); mark(sRead, w.read && w.scenario !== 'unknown');
      sRead.li.classList.toggle('bad', w.read && w.scenario === 'unknown');
      mark(sMat, w.material === 'spec' && w.read && w.scenario !== 'unknown');
      sMat.li.classList.toggle('bad', w.material !== 'spec');
      matButtons.forEach(b => b.setAttribute('aria-checked', String(b.dataset.value === w.material)));
      chipButtons.forEach(b => { const p = b.dataset.point, f = M.finding(id, w.scenario, p); b.dataset.state = w.done[p] ? 'done' : w.checked[p] ? (f.abnormal ? 'bad' : 'ok') : 'todo'; b.title = w.checked[p] ? f.text : '点一下检查'; });
      sCheck.li.classList.toggle('bad', M.abnormal(id, w).length > 0);
      mark(sService, w.progress >= 1);
      fill.style.width = Math.round(w.progress * 100) + '%'; pct.textContent = Math.round(w.progress * 100) + '%';
      const order = [[sPrep, w.prepared], [sIso, w.isolated], [sEnergy, w.energy], [sCheck, nChecked === st.points.length], [sRead, w.read], [sService, w.progress >= 1]];
      const next = (w.verified || w.handoff) ? null : order.find(([, d]) => !d)?.[0];
      for (const [s0] of order) s0.li.classList.toggle('next', s0 === next);
      verdict.hidden = !(w.verified || w.handoff);
      verdict.className = 'm82-verdict ' + (w.verified ? 'ok' : 'warn');
      verdict.textContent = w.verified ? '✓ 复查通过，已记入交接记录' : '⇢ 已移交 · 未解决：' + w.unresolved.join('；');
      const all = s.records || [];
      count.textContent = `${all.filter(x => x.resolved).length} 复查 · ${all.filter(x => !x.resolved).length} 未解决`;
      list.replaceChildren(...(all.length ? all.slice().reverse().map(x => {
        const li = h('li', x.resolved ? 'ok' : 'open');
        li.append(h('span', 'm82-rec-st', M.STATIONS[x.station].label), h('span', 'm82-rec-case', M.label(M.STATIONS[x.station].cases, x.scenario)), h('b', '', x.resolved ? '已复查' : '未解决'));
        li.title = x.unresolved.join('；'); return li;
      }) : [h('li', 'm82-empty', '还没有记录。复查或移交后会出现在这里。')]));
      bExport.disabled = !all.length;
    };
    view(lab.state());
    const off = lab.onChange((s, ev) => {
      if (ev?.type === 'station' || ev?.type === 'look') return;
      window.c2Lab?.ctx?._state(s);   // 立即刷新面板，不等 200 ms 轮询
      if (s.message && ev) c.feedback(s.message, s.error ? 'warn' : (ev.type === 'verify' ? 'ok' : 'info'));
    });
    c.onCleanup(off);
    c.lab.onState(s => view(s));
  }

  const STATIONS = M.IDS.map(id => ({id, name: M.STATIONS[id].label, lead: '', hint: '拖动旋转 · 滚轮缩放 · 点编号检查', build: buildStation}));

  // shared/theme.js 会把主题按钮放进第一个 .course-nav；本页没有旧导航，按钮落在外壳页头
  S.start({
    task: '8-2', title: '保养排查',
    stage: document.getElementById('m82Stage'),
    stageTop: caseBar,
    stations: STATIONS,
    current: () => lab.state().station,
    select: id => { if (lab.state().station !== id) lab.dispatch({type: 'station', value: id}); },
    poll: () => lab.state(),
    reset: id => { const w = lab.state().work[id]; lab.dispatch({type: 'case', value: w.scenario}); },
  });
})();
</script></body></html>
